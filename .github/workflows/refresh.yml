name: Refresh league data

# ============================================================
#  PUT YOUR LEAGUE ID ON THE NEXT LINE, between the quotes.
#  It's the number in your ESPN URL after  leagueId=
# ============================================================
env:
  ESPN_LEAGUE_ID: 1012356693
  ESPN_SEASON: "2026"

on:
  schedule:
    # 11:00 UTC Tuesday — after Monday Night Football wraps in the US.
    - cron: "0 11 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: league-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: league-site
      - id: deployment
        uses: actions/deploy-pages@v4
